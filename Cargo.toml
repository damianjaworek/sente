[package]
authors = ["Damian Jaworek <damianjaworek@outlook.com>"]
edition = "2018"
name = "esprimo"
version = "0.1.0"
[[bin]]
name = "esprimoc"
path = "src/main.rs"

[build-dependencies]
[build-dependencies.lalrpop]
features = ["lexer"]
version = "0.19"

[dependencies]
lalrpop-util = "0.19"
leb128 = "0.2"
regex = "1"
structopt = "0.3"

[lib]
name = "esprimo"
path = "src/lib.rs"
